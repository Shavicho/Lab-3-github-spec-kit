<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convierte importes entre monedas con tipos de cambio actuales."
    />
    <title>Conversor de monedas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="converter-card" aria-labelledby="page-title">
        <p class="eyebrow">Tipos de cambio actuales</p>
        <h1 id="page-title">Conversor de monedas</h1>
        <p class="intro">Convierte importes con información de Frankfurter.</p>

        <form id="converter-form" aria-busy="false" novalidate>
          <div class="field">
            <label for="amount">Cantidad</label>
            <input
              id="amount"
              name="amount"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Por ejemplo, 100"
              aria-describedby="amount-help"
            />
            <small id="amount-help">Usa coma o punto para los decimales.</small>
          </div>

          <div class="currency-row">
            <div class="field">
              <label for="from-currency">Moneda de origen</label>
              <select id="from-currency" name="fromCurrency" disabled></select>
            </div>
            <button
              id="swap-currencies"
              class="swap-button"
              type="button"
              disabled
              aria-label="Intercambiar monedas"
              title="Intercambiar monedas"
            >
              <span aria-hidden="true">⇄</span>
            </button>
            <div class="field">
              <label for="to-currency">Moneda de destino</label>
              <select id="to-currency" name="toCurrency" disabled></select>
            </div>
          </div>

          <button id="convert-button" class="convert-button" type="submit" disabled>
            Convertir
          </button>
        </form>

        <p id="loading" class="message message--loading" role="status" aria-live="polite" hidden>
          Cargando monedas disponibles…
        </p>
        <p id="error" class="message message--error" role="alert" hidden></p>
        <section
          id="result"
          class="result"
          aria-live="polite"
          aria-atomic="true"
          hidden
        ></section>
      </section>
      <footer>Las conversiones utilizan las tasas publicadas por Frankfurter.</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
